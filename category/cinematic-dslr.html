<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body>

<header class="header">
  <h1>Cinematic DSLR Prompts</h1>
  <p>Professional DSLR-style cinematic AI prompts – copy & generate stunning visuals</p>
</header>

<section class="prompt-card">
  <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330" alt="Cinematic DSLR portrait">
  <textarea readonly id="dslr1">
Ultra-realistic DSLR portrait, 85mm lens, f/1.8 aperture, soft cinematic lighting, natural skin texture, shallow depth of field, professional color grading
  </textarea>
  <button onclick="copyPrompt('dslr1')">Copy Prompt</button>
</section>

<section class="prompt-card">
  <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9" alt="Cinematic close up">
  <textarea readonly id="dslr2">
Cinematic close-up portrait, DSLR camera look, dramatic side lighting, realistic shadows, film-style color grading, high dynamic range
  </textarea>
  <button onclick="copyPrompt('dslr2')">Copy Prompt</button>
</section>

<section class="prompt-card">
  <img src="https://images.unsplash.com/photo-1503342217505-b0a15ec3261c" alt="Cinematic outdoor">
  <textarea readonly id="dslr3">
Outdoor cinematic DSLR shot, golden hour lighting, realistic colors, background bokeh, professional photography composition, ultra-detailed
  </textarea>
  <button onclick="copyPrompt('dslr3')">Copy Prompt</button>
</section>
